name: Build signed MATH DASH release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4
      - name: تنظیم Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: تنظیم Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: بررسی و آماده‌سازی کلید امضا
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::GitHub Secret $name is missing. No release APK was built."
              exit 1
            fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/math-dash-release.keystore"
          test -s "$RUNNER_TEMP/math-dash-release.keystore"
      - name: نصب وابستگی‌ها و ساخت وب
        run: |
          npm install
          npm run build
      - name: ایجاد پروژه اندروید
        run: npx cap add android
      - name: پیکربندی امضای نسخه Release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/math-dash-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/prepare-release-gradle.py
      - name: ساخت APK امضاشده
        working-directory: android
        run: ./gradlew assembleRelease
      - name: بررسی امضا و ساخت آیکون فروشگاه
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 512 -h 512 public/icon.svg -o math-dash-store-icon-512.png
          sha256sum "$APK" | tee release-sha256.txt
      - name: بارگذاری فایل‌های انتشار
        uses: actions/upload-artifact@v4
        with:
          name: math-dash-0.1.3-signed-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            math-dash-store-icon-512.png
            release-sha256.txt
          if-no-files-found: error
          retention-days: 30
