name: Android signed APK

on:
  push:
    branches:
      - MATH-DASH-ANDROID-SIGNING-001
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build and sign release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Build web application
        run: npm run build

      - name: Generate Android project when absent
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          mkdir -p "$RUNNER_TEMP/android-signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/release-key.jks"
          test -s "$RUNNER_TEMP/android-signing/release-key.jks"

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/android-signing/release-key.jks
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text(encoding="utf-8")

          if "signingConfigs" in text and "signingConfig signingConfigs.release" in text:
              raise SystemExit("Release signing already configured; refusing to patch twice")

          signing = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  }
              }

          """
          if not re.search(r"\\bbuildTypes\\s*\\{", text):
              raise SystemExit("Could not find buildTypes block in generated app/build.gradle")
          text = re.sub(r"(\\bbuildTypes\\s*\\{)", signing + r"\\1", text, count=1)

          pattern = r"(buildTypes\\s*\\{\\s*release\\s*\\{)"
          if not re.search(pattern, text):
              raise SystemExit("Could not find release build type block")
          text = re.sub(pattern, r"\\1\\n            signingConfig signingConfigs.release", text, count=1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Assemble signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/android-signing/release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing KEY_ALIAS secret"; exit 1; }
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Verify APK signature
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: math-dash-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
