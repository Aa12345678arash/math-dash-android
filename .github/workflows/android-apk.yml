name: Build signed MATH DASH Android APK

on:
  push:
    branches:
      - MATH-DASH-ANDROID-SIGNING-001
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: تنظیم Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: تنظیم Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: تنظیم Android SDK
        uses: android-actions/setup-android@v3

      - name: نصب Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: نصب وابستگی‌ها
        run: npm install --no-audit --no-fund

      - name: ساخت نسخه وب
        run: npm run build

      - name: ایجاد و همگام‌سازی پروژه اندروید
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: آماده‌سازی کلید امضا
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Secret ANDROID_KEYSTORE_BASE64 is missing"; exit 1; }
          mkdir -p "$RUNNER_TEMP/android-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/release-key.jks"
          test -s "$RUNNER_TEMP/android-signing/release-key.jks"

      - name: پیکربندی امضای نسخه انتشار
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/android-signing/release-key.jks
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text(encoding="utf-8")

          if "signingConfig signingConfigs.release" in text:
              raise SystemExit("Release signing is already configured")

          signing = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  }
              }

          """
          build_types = r"(\bbuildTypes\s*\{)"
          if not re.search(build_types, text):
              raise SystemExit("Could not find buildTypes block")
          text = re.sub(build_types, lambda m: signing + m.group(1), text, count=1)

          release_block = r"(buildTypes\s*\{\s*release\s*\{)"
          if not re.search(release_block, text):
              raise SystemExit("Could not find release build type")
          text = re.sub(
              release_block,
              lambda m: m.group(1) + "\n            signingConfig signingConfigs.release",
              text,
              count=1,
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: ساخت APK امضاشده
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/android-signing/release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Secret ANDROID_KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Secret KEY_ALIAS is missing"; exit 1; }
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: بررسی امضای APK و محاسبه هش
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"

      - name: بارگذاری APK امضاشده
        uses: actions/upload-artifact@v4
        with:
          name: math-dash-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
