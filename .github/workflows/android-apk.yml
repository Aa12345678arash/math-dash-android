name: Build MATH DASH Android APK

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4
      - name: تنظیم Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: تنظیم Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: نصب وابستگی‌ها
        run: npm install
      - name: ساخت نسخه وب
        run: npm run build
      - name: ایجاد پروژه اندروید
        run: npx cap add android
      - name: تنظیم نسخه واقعی اندروید 0.1.5
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle")
          s = p.read_text()
          s, a = re.subn(r'versionCode\\s+\\d+', 'versionCode 2', s, count=1)
          s, b = re.subn(r'versionName\\s+"[^"]+"', 'versionName "0.1.5"', s, count=1)
          if a != 1 or b != 1:
              raise SystemExit("Could not safely set Android versionCode/versionName")
          p.write_text(s)
          print("Android versionCode=2, versionName=0.1.5")
          PY
      - name: ساخت آیکن بومی اندروید از نشان MATH DASH
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            density=$1
            size=$2
            mkdir -p "android/app/src/main/res/mipmap-$density"
            rsvg-convert -w "$size" -h "$size" public/icon.svg -o "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            rsvg-convert -w "$size" -h "$size" public/icon.svg -o "android/app/src/main/res/mipmap-$density/ic_launcher_foreground.png"
          done
      - name: همگام‌سازی Capacitor
        run: npx cap sync android
      - name: ساخت APK آزمایشی
        working-directory: android
        run: ./gradlew assembleDebug
      - name: بارگذاری APK
        uses: actions/upload-artifact@v4
        with:
          name: math-dash-0.1.5-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
