name: Build MATH DASH Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4
      - name: تنظیم Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: تنظیم Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: نصب وابستگی‌ها
        run: npm install
      - name: ساخت نسخه وب
        run: npm run build
      - name: ایجاد پروژه اندروید
        run: npx cap add android
      - name: همگام‌سازی Capacitor
        run: npx cap sync android
      - name: ساخت APK آزمایشی
        working-directory: android
        run: ./gradlew assembleDebug
      - name: بارگذاری APK
        uses: actions/upload-artifact@v4
        with:
          name: math-dash-0.1.1-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
